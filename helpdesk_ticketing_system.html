
<h2 class="sr-only">Helpdesk ticketing system with a ticket submission form and admin dashboard to view and manage tickets</h2>

<style>
:root { --nav-h: 48px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }

.nav { display: flex; gap: 0; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 1.5rem; }
.nav-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 20px; font-size: 14px; cursor: pointer; color: var(--color-text-secondary); font-family: var(--font-sans); transition: color 0.15s; }
.nav-btn.active { color: var(--color-text-primary); border-bottom-color: var(--color-text-primary); font-weight: 500; }
.nav-btn:hover:not(.active) { color: var(--color-text-primary); }

.view { display: none; }
.view.active { display: block; }

.form-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; max-width: 580px; }
.form-header { margin-bottom: 1.25rem; }
.form-header p { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.form-group label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
.form-group input, .form-group textarea, .form-group select { font-family: var(--font-sans); font-size: 14px; }
.form-group textarea { resize: vertical; min-height: 90px; }
.urgency-row { display: flex; gap: 8px; }
.urgency-btn { flex: 1; padding: 7px 0; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; background: none; font-family: var(--font-sans); color: var(--color-text-secondary); transition: all 0.15s; }
.urgency-btn:hover { background: var(--color-background-secondary); }
.urgency-btn.sel-low { background: #EAF3DE; color: #3B6D11; border-color: #639922; }
.urgency-btn.sel-medium { background: #FAEEDA; color: #854F0B; border-color: #BA7517; }
.urgency-btn.sel-high { background: #FAECE7; color: #993C1D; border-color: #D85A30; }
.urgency-btn.sel-critical { background: #FCEBEB; color: #A32D2D; border-color: #E24B4A; }
.submit-btn { margin-top: 6px; width: 100%; padding: 10px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); transition: opacity 0.15s; }
.submit-btn:hover { opacity: 0.85; }

.success-msg { display: none; background: var(--color-background-success); border: 0.5px solid var(--color-border-success); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-top: 1rem; color: var(--color-text-success); font-size: 14px; }
.success-msg i { margin-right: 6px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
.stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 500; }

.filters { display: flex; gap: 8px; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
.filters select { font-size: 13px; font-family: var(--font-sans); padding: 6px 10px; }
.filters input[type="text"] { font-size: 13px; font-family: var(--font-sans); padding: 6px 10px; flex: 1; min-width: 140px; }
.filter-label { font-size: 13px; color: var(--color-text-secondary); }

.ticket-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.ticket-table th { text-align: left; padding: 8px 10px; font-weight: 500; font-size: 12px; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
.ticket-table td { padding: 10px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); vertical-align: top; color: var(--color-text-primary); }
.ticket-table tr:last-child td { border-bottom: none; }
.ticket-table tr:hover td { background: var(--color-background-secondary); }
.ticket-table th:nth-child(1), .ticket-table td:nth-child(1) { width: 52px; }
.ticket-table th:nth-child(2), .ticket-table td:nth-child(2) { width: 130px; }
.ticket-table th:nth-child(3), .ticket-table td:nth-child(3) { width: auto; }
.ticket-table th:nth-child(4), .ticket-table td:nth-child(4) { width: 88px; }
.ticket-table th:nth-child(5), .ticket-table td:nth-child(5) { width: 90px; }
.ticket-table th:nth-child(6), .ticket-table td:nth-child(6) { width: 90px; }
.td-name { font-weight: 500; }
.td-contact { font-size: 12px; color: var(--color-text-secondary); }
.td-desc { color: var(--color-text-secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-low { background: #EAF3DE; color: #3B6D11; }
.badge-medium { background: #FAEEDA; color: #854F0B; }
.badge-high { background: #FAECE7; color: #993C1D; }
.badge-critical { background: #FCEBEB; color: #A32D2D; }
.badge-open { background: var(--color-background-info); color: var(--color-text-info); }
.badge-progress { background: #FAEEDA; color: #854F0B; }
.badge-resolved { background: #EAF3DE; color: #3B6D11; }

.status-sel { font-size: 12px; font-family: var(--font-sans); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 3px 6px; background: none; color: var(--color-text-primary); cursor: pointer; width: 100%; }
.ticket-id { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
.empty { padding: 2rem; text-align: center; color: var(--color-text-secondary); font-size: 14px; }
</style>

<div class="nav">
  <button class="nav-btn active" onclick="switchView('submit')"><i class="ti ti-ticket" aria-hidden="true"></i> Submit a ticket</button>
  <button class="nav-btn" onclick="switchView('admin')"><i class="ti ti-layout-list" aria-hidden="true"></i> Admin dashboard</button>
</div>

<div id="view-submit" class="view active">
  <div class="form-card">
    <div class="form-header">
      <h3 style="font-size:16px; font-weight:500;">Open a support ticket</h3>
      <p>Fill in the details below and our team will get back to you.</p>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="f-name">Full name</label>
        <input type="text" id="f-name" placeholder="Jane Smith" />
      </div>
      <div class="form-group">
        <label for="f-phone">Telephone</label>
        <input type="tel" id="f-phone" placeholder="+1 555 000 0000" />
      </div>
    </div>
    <div class="form-group">
      <label for="f-email">Email address</label>
      <input type="email" id="f-email" placeholder="jane@company.com" />
    </div>
    <div class="form-group">
      <label for="f-desc">Issue description</label>
      <textarea id="f-desc" placeholder="Describe your issue in as much detail as possible…"></textarea>
    </div>
    <div class="form-group">
      <label>Urgency</label>
      <div class="urgency-row">
        <button class="urgency-btn" data-level="low" onclick="selectUrgency(this)">Low</button>
        <button class="urgency-btn" data-level="medium" onclick="selectUrgency(this)">Medium</button>
        <button class="urgency-btn" data-level="high" onclick="selectUrgency(this)">High</button>
        <button class="urgency-btn" data-level="critical" onclick="selectUrgency(this)">Critical</button>
      </div>
    </div>
    <button class="submit-btn" onclick="submitTicket()">Submit ticket</button>
    <div class="success-msg" id="success-msg">
      <i class="ti ti-circle-check" aria-hidden="true"></i>
      Ticket submitted successfully. <span id="ticket-ref"></span>
    </div>
  </div>
</div>

<div id="view-admin" class="view">
  <div class="stats" id="stats-row"></div>
  <div class="filters">
    <span class="filter-label">Filter:</span>
    <select id="fil-status" onchange="renderTable()">
      <option value="">All statuses</option>
      <option value="Open">Open</option>
      <option value="In progress">In progress</option>
      <option value="Resolved">Resolved</option>
    </select>
    <select id="fil-urgency" onchange="renderTable()">
      <option value="">All urgencies</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <input type="text" id="fil-search" placeholder="Search by name or issue…" oninput="renderTable()" />
  </div>
  <div style="overflow-x: auto;">
    <table class="ticket-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Client</th>
          <th>Issue</th>
          <th>Urgency</th>
          <th>Status</th>
          <th>Submitted</th>
        </tr>
      </thead>
      <tbody id="ticket-tbody"></tbody>
    </table>
    <div id="empty-state" class="empty" style="display:none;"><i class="ti ti-inbox" style="font-size:24px; display:block; margin-bottom:8px;" aria-hidden="true"></i>No tickets found</div>
  </div>
</div>

<script>
let tickets = [
  { id: 'TK-001', name: 'Maria Gomez', phone: '+1 555 234 5678', email: 'maria@acme.com', desc: 'Cannot log into the CRM portal — getting a 403 error on every attempt since yesterday morning.', urgency: 'critical', status: 'Open', date: '2026-05-12' },
  { id: 'TK-002', name: 'Tom Baxter', phone: '+44 7700 900123', email: 'tom.b@techco.io', desc: 'Email sync has stopped working on Outlook. Sent items not appearing.', urgency: 'high', status: 'In progress', date: '2026-05-11' },
  { id: 'TK-003', name: 'Priya Nair', phone: '+91 98765 43210', email: 'priya@startupx.in', desc: 'Printer on floor 2 is offline. Tried restarting, did not help.', urgency: 'low', status: 'Open', date: '2026-05-11' },
  { id: 'TK-004', name: 'Leo Fontaine', phone: '+33 6 12 34 56 78', email: 'leo.f@corp.fr', desc: 'VPN keeps disconnecting every 10–15 minutes during video calls.', urgency: 'medium', status: 'Resolved', date: '2026-05-10' },
];
let nextId = 5;
let selectedUrgency = '';

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function selectUrgency(btn) {
  document.querySelectorAll('.urgency-btn').forEach(b => { b.className = 'urgency-btn'; });
  selectedUrgency = btn.dataset.level;
  btn.classList.add('sel-' + selectedUrgency);
}

function switchView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  event.currentTarget.classList.add('active');
  if (v === 'admin') { renderStats(); renderTable(); }
}

function submitTicket() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  if (!name || !phone || !email || !desc || !selectedUrgency) {
    alert('Please fill in all fields and select an urgency level.');
    return;
  }
  const id = 'TK-0' + pad(nextId++);
  const today = new Date().toISOString().slice(0, 10);
  tickets.unshift({ id, name, phone, email, desc, urgency: selectedUrgency, status: 'Open', date: today });
  document.getElementById('f-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-email').value = '';
  document.getElementById('f-desc').value = '';
  document.querySelectorAll('.urgency-btn').forEach(b => b.className = 'urgency-btn');
  selectedUrgency = '';
  const sm = document.getElementById('success-msg');
  document.getElementById('ticket-ref').textContent = 'Reference: ' + id;
  sm.style.display = 'block';
  setTimeout(() => { sm.style.display = 'none'; }, 5000);
}

function renderStats() {
  const total = tickets.length;
  const open = tickets.filter(t => t.status === 'Open').length;
  const inprog = tickets.filter(t => t.status === 'In progress').length;
  const crit = tickets.filter(t => t.urgency === 'critical').length;
  const rows = [
    { label: 'Total tickets', value: total },
    { label: 'Open', value: open },
    { label: 'In progress', value: inprog },
    { label: 'Critical', value: crit },
  ];
  document.getElementById('stats-row').innerHTML = rows.map(r =>
    `<div class="stat"><div class="stat-label">${r.label}</div><div class="stat-value">${r.value}</div></div>`
  ).join('');
}

function statusBadge(s) {
  const map = { 'Open': 'badge-open', 'In progress': 'badge-progress', 'Resolved': 'badge-resolved' };
  return `<span class="badge ${map[s] || ''}">${s}</span>`;
}

function renderTable() {
  const fs = document.getElementById('fil-status').value;
  const fu = document.getElementById('fil-urgency').value;
  const fq = document.getElementById('fil-search').value.toLowerCase();
  const filtered = tickets.filter(t => {
    if (fs && t.status !== fs) return false;
    if (fu && t.urgency !== fu) return false;
    if (fq && !t.name.toLowerCase().includes(fq) && !t.desc.toLowerCase().includes(fq)) return false;
    return true;
  });
  renderStats();
  const tbody = document.getElementById('ticket-tbody');
  const empty = document.getElementById('empty-state');
  if (!filtered.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = filtered.map(t => `
    <tr>
      <td class="ticket-id">${t.id}</td>
      <td>
        <div class="td-name">${t.name}</div>
        <div class="td-contact">${t.email}</div>
        <div class="td-contact">${t.phone}</div>
      </td>
      <td><div class="td-desc" title="${t.desc}">${t.desc}</div></td>
      <td><span class="badge badge-${t.urgency}">${t.urgency.charAt(0).toUpperCase() + t.urgency.slice(1)}</span></td>
      <td>
        <select class="status-sel" onchange="changeStatus('${t.id}', this.value)">
          <option ${t.status==='Open'?'selected':''}>Open</option>
          <option ${t.status==='In progress'?'selected':''}>In progress</option>
          <option ${t.status==='Resolved'?'selected':''}>Resolved</option>
        </select>
      </td>
      <td style="font-size:12px; color:var(--color-text-secondary);">${t.date}</td>
    </tr>
  `).join('');
}

function changeStatus(id, newStatus) {
  const t = tickets.find(t => t.id === id);
  if (t) { t.status = newStatus; renderStats(); }
}

renderStats();
renderTable();
</script>
